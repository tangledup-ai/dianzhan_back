/* ══════════ 渲染 ══════════ */
function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>{
    const target = !!TARGETS[n.to];
    return `<a data-to="${n.to}" class="${state.route===n.to?'active':''}">
      <span class="i">${ICONS[n.to]||'·'}</span>${n.label}${target?'':'<span class="out">不改</span>'}
    </a>`;
  }).join('');
  document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{
    state.route = a.dataset.to; state.open.clear();
    document.getElementById('pageTitle').textContent = (TARGETS[state.route] || NAV.find(n=>n.to===state.route).label);
    try{ history.replaceState(null,'','#'+state.route); }catch(e){}
    render();
  });
}

function cellHtml(row, col, ctx){
  const v = col.calc ? col.calc(row) : row[col.k];
  const raw = row[col.k];
  const canEdit = typeof col.edit==='function' ? col.edit(row) : !!col.edit;
  const derived = (raw==null||raw==='') && !!col.calc;
  const key = ctx+':'+col.k;
  const edited = state.dirty.has(key) ? ' edited' : '';
  if(canEdit){
    if(col.type==='bool')
      return `<td class="ctr${edited}"><input type="checkbox" data-edit="${ctx}:${col.k}" ${v?'checked':''} style="width:auto;height:auto"></td>`;
    if(col.type==='cat'){
      const o = Object.entries(CATS).map(([k2,l])=>`<option value="${k2}" ${v===k2?'selected':''}>${l}</option>`).join('');
      return `<td class="${edited}"><select data-edit="${ctx}:${col.k}">${o}</select></td>`;
    }
    if(col.type==='pstatus'||col.type==='cstatus'){
      const opts = col.type==='pstatus'?['未付款','已付款','部分付款']:['未到账','已到账','部分到账'];
      return `<td class="${edited}"><select data-edit="${ctx}:${col.k}">${opts.map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('')}</select></td>`;
    }
    const show = derived ? col.calc(row) : v;
    const dv = (col.type==='num'||col.type==='calc') ? fmt(show, col.dec??2) : (show??'');
    return `<td class="${col.type==='num'?'num ':''}${derived?'derived ':''}${edited}">`+
           `<input data-edit="${ctx}:${col.k}" value="${dv}"></td>`;
  }
  if(col.type==='status'||col.type==='pstatus'||col.type==='cstatus'){
    const m = {'已付款':'ok','已到账':'ok','正常':'ok','未付款':'no','未到账':'no','部分付款':'part','部分到账':'part','待归位':'part'};
    return `<td class="ctr"><span class="badge ${m[v]||'no'}">${v??'—'}</span></td>`;
  }
  let disp;
  if(col.type==='cat') disp = CATS[v]||'';
  else if(col.type==='bool') disp = v?'是':'';
  else if(col.type==='src') disp = v==='api'?'电表API':'手工';
  else if(col.type==='num'||col.type==='calc') disp = fmt(v,col.dec??2);
  else disp = v??'';
  const cls = (col.type==='num'||col.type==='calc'?'num ':'') + (disp===''?'muted ':'') + (derived?'derived ':'') + (col.neg&&num(v)<0?'neg ':'');
  return `<td class="${cls}">${disp===''?'—':disp}</td>`;
}

function renderGrid(sheet, ctxPrefix){
  const {cols, rows} = sheet;
  let left = 30; const off={};
  cols.forEach(c=>{ if(c.freeze){ off[c.k]=left; left+=c.w; } });
  const fs = c => c.freeze?` style="left:${off[c.k]}px"`:'';
  const fc = c => c.freeze?' freeze':'';

  const colgroup = '<colgroup><col style="width:30px">'+cols.map(c=>`<col style="width:${c.w}px">`).join('')+'</colgroup>';
  const head = '<thead><tr><th class="freeze" style="left:0"></th>'+cols.map(c=>
      `<th class="${c.type==='num'||c.type==='calc'?'num':''}${fc(c)}"${fs(c)}>${c.t}</th>`).join('')+'</tr></thead>';

  let body='';
  rows.forEach((r,i)=>{
    const ctx = ctxPrefix+i;
    const open = state.open.has(ctx);
    body += `<tr class="${open?'open':''}" data-row="${ctx}">`;
    body += `<td class="ctr freeze" style="left:0"><span class="arrow" data-toggle="${ctx}">${open?'▼':'▶'}</span></td>`;
    cols.forEach(c=>{ body += cellHtml(r,c,ctx); });
    body += '</tr>';
    if(open){
      const d = sheet.detail && sheet.detail[r.landlord+'|'+r.period];
      body += `<tr class="detail"><td colspan="${cols.length+1}">`;
      if(d){
        body += `<div class="dtitle">${d.title}</div><div class="dwrap"><table><thead><tr>`+
          d.cols.map(c=>`<th style="width:${c.w}px">${c.t}</th>`).join('')+'</tr></thead><tbody>'+
          d.rows.map(dr=>'<tr>'+d.cols.map(c=>{
            const v=dr[c.k];
            if(c.type==='num') return `<td class="num">${fmt(v,2)}</td>`;
            if(c.type==='cstatus') return `<td class="ctr"><span class="badge ${v==='已到账'?'ok':v==='部分到账'?'part':'no'}">${v}</span></td>`;
            return `<td>${v??'—'}</td>`;
          }).join('')+'</tr>').join('')+'</tbody></table></div>';
      } else if(r.readings && r.readings.length){
        body += `<div class="dtitle">${r.meter_no} · 月度读数（实际电量可直接改，替代原"抄表补录"弹窗）</div>
          <div class="dwrap"><table><thead><tr>
            <th style="width:80px">月份</th><th style="width:120px">平台电量</th>
            <th style="width:130px">实际电量（可改）</th><th style="width:160px">抄表区间</th>
            <th style="width:90px">数据来源</th></tr></thead><tbody>`+
          r.readings.map(rd=>`<tr><td class="ctr">${rd.period}</td><td class="num">${fmt(rd.plat,2)}</td>
            <td class="num"><input data-dedit="${ctx}|${rd.period}|actual" value="${editVal(rd.actual,2)}"></td>
            <td class="ctr">${rd.range}</td><td class="ctr">${rd.actual!=null?'人工修正':'第三方同步'}</td></tr>`).join('')+
          '</tbody></table></div>';
        if(r.allocs && r.allocs.length){
          body += `<div class="dtitle" style="margin-top:10px">${r.meter_no} · 品牌分摊（替代原"品牌分摊"弹窗）</div>
            <div class="dwrap"><table><thead><tr>
              <th style="width:110px">品牌</th><th style="width:90px">录入方式</th>
              <th style="width:110px">应收金额</th><th style="width:110px">应收电量</th>
              <th style="width:80px">单价</th><th style="width:80px">柜数</th></tr></thead><tbody>`+
            r.allocs.map(a=>`<tr><td>${a.brand}</td>
              <td class="ctr">${a.mode==='amount'?'录金额':'录电量'}</td>
              <td class="num">${a.amount!=null?fmt(a.amount,2):`<span style="color:#4f7a63;font-style:italic">${fmt(num(a.kwh)*num(a.price),2)}</span>`}</td>
              <td class="num">${a.kwh!=null?fmt(a.kwh,2):`<span style="color:#4f7a63;font-style:italic">${fmt(num(a.amount)/num(a.price||1),2)}</span>`}</td>
              <td class="num">${a.price}</td><td class="num">${a.cabs}</td></tr>`).join('')+
            '</tbody></table></div>';
        }
      } else {
        body += '<div style="color:#94a3b8">该表暂无月度读数明细</div>';
      }
      body += '</td></tr>';
    }
  });

  let foot = '<tfoot><tr><td class="freeze" style="left:0"></td>';
  let placed=false;
  cols.forEach(c=>{
    if(!placed){ placed=true; foot += `<td class="${fc(c)}"${fs(c)}>合计</td>`; return; }
    if(c.sum){
      const s = rows.reduce((a,r)=>a+num(c.calc?c.calc(r):r[c.k]),0);
      foot += `<td class="num${fc(c)}"${fs(c)}${(c.neg&&s<0)?' style="color:#e11d48"':''}>${fmt(s,c.dec??2)}</td>`;
    } else foot += `<td class="${fc(c)}"${fs(c)}></td>`;
  });
  foot += '</tr></tfoot>';

  return `<div class="grid-wrap"><table>${colgroup}${head}<tbody>${body}</tbody>${foot}</table></div>`;
}

function summary(items){
  return '<div class="summary">'+items.map(x=>
    `<div class="cell"><div class="lbl">${x.l}</div><div class="val ${x.tone||''}">${x.v}</div></div>`).join('')+'</div>';
}

const PAGES = {'/meters':pageMeters, '/rent':pageRent, '/electricity':pageElec};

function render(){
  renderNav();
  const box = document.getElementById('content');
  if(PAGES[state.route]) box.innerHTML = PAGES[state.route]();
  else box.innerHTML = `<div class="notchanged"><b>「${NAV.find(n=>n.to===state.route).label}」本次不改</b>
      保持现有外观与交互。本次只把 <b style="display:inline">智慧电表 / 场租台账 / 电费台账</b> 三个页面改成类 Excel 风。</div>`;
  bind();
}

function bind(){
  document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=e=>{
    const k = el.dataset.toggle;
    if(state.open.has(k)) state.open.delete(k); else state.open.add(k);
    render();
  });
  document.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('change',()=>{
    const [ctx,k] = el.dataset.edit.split(':');
    const sheet = {m:DATA.meters,r:DATA.rent,e:DATA.elec}[ctx[0]];
    const i = Number(ctx.slice(1));
    const col = sheet.cols.find(c=>c.k===k);
    let v = el.type==='checkbox' ? el.checked : el.value;
    if(col.type==='num') v = v===''?null:Number(String(v).replace(/,/g,''));
    if(col.type==='num' && Number.isNaN(v)) v = null;
    sheet.rows[i][k] = v;
    state.dirty.add(ctx+':'+k);
    render();
  }));
  document.querySelectorAll('[data-dedit]').forEach(el=>el.addEventListener('change',()=>{
    state.dirty.add(el.dataset.dedit); render();
  }));
}

/* 深链接：#/meters 或 ?p=rent（前者给真人点，后者方便命令行/截图） */
function applyHash(){
  const fromQuery = new URLSearchParams(location.search).get('p');
  const p = fromQuery ? '/'+fromQuery : (location.hash||'').replace('#','');
  if(NAV.some(n=>n.to===p)) state.route = p;
  document.getElementById('pageTitle').textContent = (TARGETS[state.route] || NAV.find(n=>n.to===state.route).label);
}
window.addEventListener('hashchange',()=>{ applyHash(); state.open.clear(); render(); });
applyHash();
/* ?open=1 时自动展开第一行（方便演示"展开代替弹窗"） */
if(new URLSearchParams(location.search).has('open')){
  const k = state.route==='/meters'?'m':state.route==='/rent'?'r':'e';
  state.open.add(k+'0');
}
render();
