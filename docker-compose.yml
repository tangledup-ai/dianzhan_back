name: battery-swap-v2

services:
  backend:
    build: ./backend
    container_name: battery-swap-v2-backend
    ports:
      - "3001:3001"
    environment:
      # ★V5 适配（切片1）：切到 huandian_v5（45 表 + 4 视图，见 database_init_v5.sql）
      # 回滚：把库名改回 huandian_v2 即可（旧库一字未动）
      - DATABASE_URL=postgresql://quant:CHANGE_ME_DB_PASSWORD@host.docker.internal:5432/huandian_v5
      # ★V5：建库脚本改用 v5（否则启动时会把 v2 的 meter_monthly 等表建回新库）
      - DB_SCHEMA_FILE=database_init_v5.sql
      # 让 print() 立即输出，便于看启动/台账生成的日志
      - PYTHONUNBUFFERED=1
      - PORT=3001
      - TQ_API_URL=https://api1.tqdianbiao.com
      - TQ_AUTH_CODE=5ec0b6bf6f59984d97ec54f775a3c780
      # 美团场租 Excel 已下线（v2 租金主源为 contracts），路径仅作兼容保留
      - RENT_EXCEL_PATH=/app/data/2026-2027美团场租.xlsx
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: battery-swap-v2-frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    restart: unless-stopped
