name: battery-swap-v2

services:
  backend:
    build: ./backend
    container_name: battery-swap-v2-backend
    ports:
      - "3002:3001"
    environment:
      # v2 真实库：huandian_v2（39 表，与 database_init.sql 一致）——勿连 dianzhan-test（另一个项目的旧库）
      - DATABASE_URL=postgresql://quant:quant-speed123@host.docker.internal:5432/huandian_v2
      - PORT=3001
      - TQ_API_URL=https://api1.tqdianbiao.com
      - TQ_AUTH_CODE=5ec0b6bf6f59984d97ec54f775a3c780
      # 美团场租 Excel 已下线（v2 租金主源为 contracts），路径仅作兼容保留
      - RENT_EXCEL_PATH=/app/data/2026-2027美团场租.xlsx
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: battery-swap-v2-frontend
    ports:
      - "8086:80"
    depends_on:
      - backend
    restart: unless-stopped
